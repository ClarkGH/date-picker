<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>date-picker e2e fixture</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script type="module" src="/src/define.ts"></script>
  </head>
  <!-- Test-only page: a form, a fieldset, and a spacer so there's room to scroll -->
  <body>
    <main class="demo">
      <h1>Fixture</h1>
      <form id="form">
        <consistent-date-picker id="plain" name="when" label="Meeting date"></consistent-date-picker>
        <consistent-date-picker id="required" name="due" label="Due date" required></consistent-date-picker>
        <consistent-date-picker id="defaulted" name="start" label="Start date" selectedDate="07/04/1999"></consistent-date-picker>
        <fieldset id="fieldset">
          <legend>Disabled group</legend>
          <consistent-date-picker id="grouped" name="grouped" label="Grouped date"></consistent-date-picker>
        </fieldset>
        <button type="submit">Submit</button>
      </form>
      <consistent-date-picker
        id="themed"
        label="Themed date"
        selectedDate="11/03/2026"
        style="
          --consistent-date-picker-font-size: 20px;
          --consistent-date-picker-background: rgb(255, 250, 240);
          --consistent-date-picker-text-color: rgb(20, 20, 20);
          --consistent-date-picker-border-color: rgb(120, 120, 120);
          --consistent-date-picker-radius: 12px;
          --consistent-date-picker-accent: rgb(98, 0, 238);
          --consistent-date-picker-accent-text: rgb(255, 255, 255);
        "
      ></consistent-date-picker>
      <div id="clipper" style="overflow: hidden; height: 120px; position: relative; z-index: 0">
        <consistent-date-picker id="clipped" label="Clipped date"></consistent-date-picker>
      </div>
      <div id="cover" style="position: relative; z-index: 100; height: 600px; background: gray" aria-hidden="true"></div>
      <div style="height: 1500px" aria-hidden="true"></div>
      <consistent-date-picker id="far" label="Far date"></consistent-date-picker>
      <div style="height: 1500px" aria-hidden="true"></div>
    </main>
    <script>
      window.submitted = null;
      document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        window.submitted = Object.fromEntries(new FormData(e.target));
      });
    </script>
  </body>
</html>
